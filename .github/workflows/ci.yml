name: CI
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: new-horizon-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: new-horizon-web/package-lock.json
      - run: npm ci
      - run: npm run build
    env:
      VITE_SUPABASE_URL: placeholder
      VITE_SUPABASE_ANON_KEY: placeholder
