version: 2
updates:
  - package-ecosystem: "npm" 
    directory: "/new-horizon-web"
    schedule: { interval: "weekly" }
    open-pull-requests-limit: 10
    groups:
      react:
        patterns: ["react", "react-dom", "react-router-dom"]
      vite:
        patterns: ["vite", "@vitejs/*"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule: { interval: "weekly" }
